name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Ruff
        working-directory: backend
        run: .venv/bin/ruff check app tests scripts ../scripts/async-worker-smoke.py

      - name: Pytest
        working-directory: backend
        run: .venv/bin/pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Locale key consistency
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const files = ["en", "ko", "ja", "zh", "hi"].map((lang) => `frontend/src/locales/${lang}.json`);
          const entries = files.map((file) => [file, Object.keys(JSON.parse(fs.readFileSync(file, "utf8"))).sort()]);
          const base = entries[0][1];
          for (const [file, keys] of entries) {
            const missing = base.filter((key) => !keys.includes(key));
            const extra = keys.filter((key) => !base.includes(key));
            if (missing.length || extra.length) {
              console.error(file, { missing, extra });
              process.exit(1);
            }
          }
          console.log(`ok: ${base.length} locale keys across ${files.length} languages`);
          NODE

      - name: Build
        working-directory: frontend
        run: npm run build

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict
      - run: scripts/check-docs-site.sh site

  containers:
    name: Container integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: cvn-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CVN_API_IMAGE: channel-vault-nas-api:ci
      CVN_WEB_IMAGE: channel-vault-nas-web:ci
      CVN_WEB_PORT: "15173"
      CVN_API_PORT: "18000"
      CVN_AUTH_TOKEN: cvn-isolated-container-test-token
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Set isolated storage paths
        run: |
          echo "CVN_METADATA_HOST_DIR=$RUNNER_TEMP/cvn/metadata" >> "$GITHUB_ENV"
          echo "CVN_DOWNLOAD_HOST_DIR=$RUNNER_TEMP/cvn/archive" >> "$GITHUB_ENV"
          echo "CVN_RUNTIME_HOST_DIR=$RUNNER_TEMP/cvn/runtime" >> "$GITHUB_ENV"
      - name: Build and start both containers
        run: scripts/compose-smoke.sh
      - name: Check proxied authentication and WebSocket upgrade
        env:
          CVN_DEPLOYMENT_SMOKE_WEB_URL: http://127.0.0.1:15173
          CVN_DEPLOYMENT_SMOKE_REQUIRE_TOKEN: "true"
        run: scripts/deployment-smoke.sh
      - name: Check asynchronous worker API through Nginx
        run: python3 scripts/async-worker-smoke.py http://127.0.0.1:15173
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop isolated stack
        if: always()
        run: docker compose down --remove-orphans

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser smoke
        working-directory: frontend
        run: npm run e2e:smoke -- --project=chromium

      - name: Run protected browser smoke
        working-directory: frontend
        env:
          CVN_E2E_AUTH_TOKEN: cvn-ci-operator-token
        run: npm run e2e:auth -- --project=chromium

      - name: Run empty first-run smoke
        working-directory: frontend
        env:
          CVN_E2E_SKIP_SEED: "true"
        run: npx playwright test e2e/demo-workspace.spec.ts --project=chromium

      - name: Run mobile reliability smoke
        working-directory: frontend
        run: npx playwright test e2e/reliability.spec.ts --project=mobile
